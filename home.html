<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RYVANTA 2026 — National Level Tech Innovation Challenge" />
  <title>RYVANTA 2026 — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- FLOATING PILL NAVBAR -->
  <nav class="pill-nav" aria-label="Main navigation">
    <a class="pill-nav-link active" href="home.html">
      <span class="pill-icon">🏠</span>
      <span class="pill-text">HOME</span>
    </a>
    <a class="pill-nav-link" href="index.html">
      <span class="pill-icon">⏱</span>
      <span class="pill-text">TIMER</span>
    </a>
    <a class="pill-nav-link" href="winners.html">
      <span class="pill-icon">🏆</span>
      <span class="pill-text">WINNERS</span>
    </a>
  </nav>

  <!-- HOME CONTENT -->
  <main class="home-stage">

    <header class="logo-zone">
      <div class="dept-header">
        <span class="dept-title">Department of Information Technology</span>
        <span class="dept-sub">organises</span>
      </div>
      <img
        src="ryvanta logo.png"
        alt="RYVANTA Tech Innovation Challenge 2026"
        class="home-logo"
        draggable="false"
      />
    </header>

    <div class="home-main-text">
      <h1 class="home-event-title">National Level Tech Innovation challenge</h1>
      <p class="home-tagline">"Turn Problem Into Possibilities"</p>
    </div>

    <!-- SPONSOR CAROUSEL (Left to Right) -->
    <footer class="sponsor-zone">
      <div class="sponsor-label">OUR SPONSORS</div>
      <div class="carousel-viewport">
        <div class="carousel-track" id="carouselTrack">
          <!-- Logos injected by carousel.js -->
        </div>
      </div>
    </footer>

  </main>

  <script src="carousel.js"></script>
  <script>
    // Hamburger nav logic
    (function initNav() {
      const btn   = document.getElementById('hamBtn');
      const nav   = document.getElementById('hamNav');
      const scrim = document.getElementById('hamScrim');
      if (!btn || !nav || !scrim) return;
      function openNav()  { btn.classList.add('open'); nav.classList.add('open'); scrim.classList.add('visible'); }
      function closeNav() { btn.classList.remove('open'); nav.classList.remove('open'); scrim.classList.remove('visible'); }
      btn.addEventListener('click', () => btn.classList.contains('open') ? closeNav() : openNav());
      scrim.addEventListener('click', closeNav);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNav(); });
    })();
  </script>
</body>
</html>
