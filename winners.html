<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RYVANTA 2026 — Winners Announcement" />
  <title>RYVANTA 2026 — Winners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── App shell ─────────────────────────────── */
    body { overflow: hidden; }
    .w-stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Screen base ───────────────────────────── */
    .w-screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
      transform: scale(0.96);
    }
    .w-screen.active  { opacity: 1; pointer-events: all; transform: scale(1); }
    .w-screen.exit-up { opacity: 0; transform: translateY(-40px) scale(0.95); pointer-events: none; }

    /* ════ SCREEN 1 – TEASER ══════════════════════ */
    .t-eyebrow {
      font-family: var(--font-ui); font-weight: 600;
      font-size: clamp(.65rem,1.2vw,.9rem); letter-spacing: .35em;
      color: var(--blue); text-transform: uppercase; margin-bottom: 14px;
    }
    .t-headline {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(2rem,7vw,6rem); letter-spacing: .05em;
      text-transform: uppercase; text-align: center; line-height: 1.1; color: var(--white);
    }
    .t-headline .accent { color: var(--blue); text-shadow: 0 0 28px rgba(61,127,255,.9),0 0 70px rgba(61,127,255,.4); }
    .t-sub  { margin-top:12px; font-size:clamp(.85rem,1.5vw,1.1rem); color:rgba(255,255,255,.45); }
    .t-moment {
      margin-top: 18px;
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(1.2rem,3.5vw,3rem); letter-spacing: .12em;
      color: #f5c518; text-transform: uppercase;
      text-shadow: 0 0 24px rgba(245,197,24,.8),0 0 70px rgba(245,197,24,.35);
      animation: goldPulse 2s ease-in-out infinite;
    }
    @keyframes goldPulse {
      0%,100%{text-shadow:0 0 20px rgba(245,197,24,.7),0 0 60px rgba(245,197,24,.3);}
      50%{text-shadow:0 0 45px rgba(245,197,24,1),0 0 110px rgba(245,197,24,.6);}
    }
    .reveal-btn {
      margin-top: 30px; padding: 16px 52px;
      font-family: var(--font-ui); font-weight: 700;
      font-size: 1rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--white); background: rgba(61,127,255,.08);
      border: 1.5px solid var(--blue); border-radius: 10px; cursor: pointer;
      box-shadow: 0 0 24px rgba(61,127,255,.3);
      transition: transform .2s, box-shadow .2s, background .2s, color .2s;
    }
    .reveal-btn:hover { transform:scale(1.06); background:var(--blue); color:#000; box-shadow:0 0 42px rgba(61,127,255,.75); }

    /* ════ SCREEN 2 – EVENT SELECT ════════════════ */
    .ev-eyebrow {
      font-family: var(--font-ui); font-weight: 600;
      font-size: clamp(.7rem,1.3vw,.9rem); letter-spacing: .3em;
      color: rgba(255,255,255,.45); text-transform: uppercase; margin-bottom: 8px;
    }
    .ev-heading {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(1.8rem,5vw,4rem); letter-spacing: .08em;
      text-transform: uppercase; color: var(--white); text-align: center;
      margin-bottom: 48px;
    }
    .ev-heading span { color: var(--blue); text-shadow: 0 0 22px rgba(61,127,255,.8); }

    .event-btns { display:flex; gap:clamp(14px,3vw,30px); flex-wrap:wrap; justify-content:center; }

    .event-btn {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: clamp(22px,3.5vw,40px) clamp(26px,5vw,56px);
      background: rgba(255,255,255,.03);
      border: 1.5px solid rgba(61,127,255,.28); border-radius: 20px;
      cursor: pointer; font-family: var(--font-display); font-weight: 700;
      font-size: clamp(.72rem,1.3vw,.95rem); letter-spacing: .18em;
      text-transform: uppercase; color: var(--white);
      backdrop-filter: blur(10px); position: relative; overflow: hidden;
      transition: border-color .3s, background .3s, transform .25s, box-shadow .3s;
    }
    .event-btn::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(circle at 50% 0%,rgba(61,127,255,.16),transparent 70%);
      opacity:0; transition:opacity .3s;
    }
    .event-btn:hover::before { opacity:1; }
    .event-btn:hover {
      border-color:var(--blue); background:rgba(61,127,255,.09);
      transform:translateY(-7px); box-shadow:0 18px 44px rgba(61,127,255,.28),0 0 0 1px rgba(61,127,255,.18);
    }
    .event-btn .ev-icon { font-size: clamp(2.4rem,5vw,4rem); line-height:1; }
    .event-btn.done { opacity:.35; pointer-events:none; border-style:dashed; }
    .event-btn.done::after {
      content:'✓ DONE'; position:absolute; top:8px; right:12px;
      color:#4cff90; font-size:.65rem; letter-spacing:.1em;
    }

    /* ════ SCREEN 3 – COUNTDOWN ═══════════════════ */
    .cd-event-lbl {
      font-family: var(--font-ui); font-weight: 600;
      font-size: clamp(.75rem,1.4vw,1rem); letter-spacing: .3em;
      color: var(--blue); text-transform: uppercase; margin-bottom: 10px;
    }
    .cd-prize-lbl {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(.95rem,2.4vw,1.9rem); letter-spacing: .2em;
      color: rgba(255,255,255,.55); text-transform: uppercase; margin-bottom: 28px;
    }
    .cd-num {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(9rem,26vw,22rem); line-height:1; color: var(--white);
      text-shadow: 0 0 50px rgba(61,127,255,.65),0 0 130px rgba(61,127,255,.3);
      animation: cdPop .5s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .cd-num.star {
      font-size: clamp(5rem,18vw,15rem);
      color: #f5c518;
      text-shadow: 0 0 50px rgba(245,197,24,.9),0 0 130px rgba(245,197,24,.4);
    }
    @keyframes cdPop  { from{transform:scale(.3);opacity:0;} to{transform:scale(1);opacity:1;} }
    @keyframes cdFade { from{transform:scale(1);opacity:1;}  to{transform:scale(2.2);opacity:0;} }
    .cd-num.fade { animation:cdFade .3s ease forwards; }

    /* ════ SCREEN 4 – WINNER REVEAL ══════════════ */
    #scr-reveal { gap: 0; }
    .rev-badge {
      font-family: var(--font-ui); font-weight: 600;
      font-size: clamp(.65rem,1.2vw,.85rem); letter-spacing: .3em;
      color: var(--blue); text-transform: uppercase; margin-bottom: 8px;
    }
    .rev-place {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(1.6rem,5vw,4rem); letter-spacing: .1em;
      text-transform: uppercase; text-align: center; margin-bottom: 28px;
      animation: slideDown .6s cubic-bezier(.34,1.3,.64,1) forwards;
    }
    .rev-place.gold-t   { color:#f5c518; text-shadow:0 0 30px rgba(245,197,24,.8),0 0 80px rgba(245,197,24,.3); }
    .rev-place.silver-t { color:#e0e0e0; text-shadow:0 0 30px rgba(224,224,224,.7),0 0 80px rgba(224,224,224,.2); }
    .rev-place.bronze-t { color:#cd7f32; text-shadow:0 0 30px rgba(205,127,50,.8),0 0 80px rgba(205,127,50,.3); }
    @keyframes slideDown { from{transform:translateY(-28px);opacity:0;} to{transform:translateY(0);opacity:1;} }

    /* Big card */
    .big-card {
      background: rgba(255,255,255,.04);
      border-radius: 22px;
      padding: clamp(26px,4vw,50px) clamp(32px,6vw,78px);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      text-align: center; backdrop-filter: blur(14px); position: relative;
      animation: cardIn .7s cubic-bezier(.34,1.4,.64,1) forwards;
      min-width: clamp(260px,42vw,520px);
    }
    .big-card.gold-c   { border:2px solid rgba(245,197,24,.6);  box-shadow:0 0 70px rgba(245,197,24,.2),  0 24px 60px rgba(0,0,0,.6); }
    .big-card.silver-c { border:2px solid rgba(224,224,224,.5); box-shadow:0 0 70px rgba(224,224,224,.15),0 24px 60px rgba(0,0,0,.6); }
    .big-card.bronze-c { border:2px solid rgba(205,127,50,.6);  box-shadow:0 0 70px rgba(205,127,50,.2),  0 24px 60px rgba(0,0,0,.6); }
    @keyframes cardIn { from{transform:scale(.35) translateY(60px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }

    .big-medal { font-size:clamp(3.5rem,8vw,7rem); line-height:1; animation:medalFlip .8s ease .25s both; }
    @keyframes medalFlip { from{transform:rotateY(90deg) scale(.5);opacity:0;} to{transform:rotateY(0) scale(1);opacity:1;} }

    .big-team {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(1.3rem,3.5vw,2.8rem); letter-spacing: .06em; color: var(--white);
      outline: none; border-bottom: 2px dashed rgba(255,255,255,.3);
      padding: 4px 10px; border-radius: 6px; min-width: 8ch; cursor: text;
      transition: border-color .2s, background .2s;
    }
    .big-team:hover  { background:rgba(255,255,255,.06);  border-bottom-color:rgba(255,255,255,.7); }
    .big-team:focus  { background:rgba(255,255,255,.11);  border-bottom:2px solid var(--white); }

    .big-college {
      font-family: var(--font-ui); font-weight: 500;
      font-size: clamp(.88rem,2vw,1.35rem); color: rgba(255,255,255,.6);
      outline:none; border-bottom:1px dashed rgba(255,255,255,.25);
      padding:3px 8px; border-radius:4px; min-width:8ch; cursor:text;
      transition: border-color .2s, background .2s;
    }
    .big-college:hover { background:rgba(255,255,255,.05); border-bottom-color:rgba(255,255,255,.6); }
    .big-college:focus { background:rgba(255,255,255,.1);  border-bottom:1px solid var(--white); color:var(--white); }

    .big-hint {
      font-size:.6rem; letter-spacing:.1em; color:rgba(61,127,255,.6);
    }

    /* Progress dots */
    .prog-dots { display:flex; gap:10px; margin-top:22px; animation:fadeUp .5s ease .7s both; }
    .prog-dot {
      width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.2);
      transition:background .3s, transform .3s;
    }
    .prog-dot.active { background:var(--blue); transform:scale(1.35); box-shadow:0 0 10px rgba(61,127,255,.6); }
    .prog-dot.done   { background:#4cff90; }

    /* Action buttons */
    .rev-actions { display:flex; gap:14px; margin-top:28px; flex-wrap:wrap; justify-content:center; animation:fadeUp .5s ease .6s both; }
    @keyframes fadeUp { from{transform:translateY(18px);opacity:0;} to{transform:translateY(0);opacity:1;} }

    .act-btn {
      padding:13px 34px; font-family:var(--font-ui); font-weight:700;
      font-size:.86rem; letter-spacing:.18em; text-transform:uppercase;
      border-radius:10px; cursor:pointer;
      transition:transform .2s, box-shadow .2s, background .2s, color .2s;
    }
    .act-btn.primary   { color:#000; background:var(--blue); border:2px solid var(--blue); box-shadow:0 0 24px rgba(61,127,255,.4); }
    .act-btn.primary:hover   { transform:scale(1.06); box-shadow:0 0 42px rgba(61,127,255,.75); }
    .act-btn.secondary { color:var(--white); background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.25); }
    .act-btn.secondary:hover { background:rgba(255,255,255,.13); transform:scale(1.04); }

    /* Confetti */
    .confetti-wrap { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20; }
    .cp {
      position:absolute; top:-10px;
      animation:cpFall linear forwards;
    }
    @keyframes cpFall {
      0%  { transform:translateY(0)      rotate(0deg);   opacity:1; }
      100%{ transform:translateY(110vh)  rotate(720deg); opacity:0; }
    }

    /* Keep sponsor bar at bottom */
    .sponsor-zone { position:fixed; bottom:0; left:0; right:0; z-index:5; }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <canvas id="techCanvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="confetti-wrap" id="confettiWrap"></div>

  <!-- NAV -->
  <nav class="pill-nav" aria-label="Site navigation">
    <a class="pill-nav-link" href="home.html"><span class="pill-icon">🏠</span><span class="pill-text">HOME</span></a>
    <div class="nav-divider"></div>
    <a class="pill-nav-link" href="countdown.html"><span class="pill-icon">⏱</span><span class="pill-text">TIMER</span></a>
    <div class="nav-divider"></div>
    <a class="pill-nav-link active" href="winners.html"><span class="pill-icon">🏆</span><span class="pill-text">WINNERS</span></a>
  </nav>

  <main class="w-stage">

    <!-- ══ SCREEN 1 : TEASER ══════════════════════════════ -->
    <div class="w-screen active" id="scr-teaser">
      <p class="t-eyebrow">RYVANTA '26</p>
      <h1 class="t-headline">
        AND THE <span class="accent">WINNERS</span> ARE…
      </h1>
      <p class="t-sub">Innovation deserves recognition.</p>
      <p class="t-moment">THE MOMENT HAS ARRIVED</p>
      <button class="reveal-btn" id="revealBtn">REVEAL WINNERS</button>
    </div>

    <!-- ══ SCREEN 2 : EVENT SELECTION ════════════════════ -->
    <div class="w-screen" id="scr-events">
      <p class="ev-eyebrow">Choose an event to reveal</p>
      <h2 class="ev-heading">SELECT <span>EVENT</span></h2>
      <div class="event-btns">
        <button class="event-btn" id="btn-hackathon" data-event="hackathon">
          <span class="ev-icon">⚡</span>
          <span>HACKATHON</span>
        </button>
        <button class="event-btn" id="btn-ctf" data-event="ctf">
          <span class="ev-icon">🚩</span>
          <span>CAPTURE THE FLAG</span>
        </button>
        <button class="event-btn" id="btn-gamedev" data-event="gamedev">
          <span class="ev-icon">🎮</span>
          <span>2D GAME DEV</span>
        </button>
      </div>
    </div>

    <!-- ══ SCREEN 3 : COUNTDOWN ═══════════════════════════ -->
    <div class="w-screen" id="scr-countdown">
      <p class="cd-event-lbl" id="cd-event-lbl">⚡ HACKATHON</p>
      <p class="cd-prize-lbl" id="cd-prize-lbl">REVEALING 3RD PLACE</p>
      <div class="cd-num"     id="cd-num">3</div>
    </div>

    <!-- ══ SCREEN 4 : WINNER REVEAL ═══════════════════════ -->
    <div class="w-screen" id="scr-reveal">
      <div class="rev-badge" id="rev-badge">⚡ HACKATHON</div>
      <div class="rev-place gold-t" id="rev-place">🥇 FIRST PLACE</div>

      <div class="big-card gold-c" id="rev-card">
        <div class="big-medal" id="rev-medal">🥇</div>
        <p class="big-team"    id="rev-team"
           contenteditable="true" spellcheck="false"
           data-default="TEAM NAME" title="Click to edit">TEAM NAME</p>
        <p class="big-college" id="rev-college"
           contenteditable="true" spellcheck="false"
           data-default="College Name" title="Click to edit">College Name</p>
        <span class="big-hint">✎ Click name / college to edit</span>
      </div>

      <div class="prog-dots"  id="prog-dots"></div>

      <div class="rev-actions">
        <button class="act-btn primary"   id="nextBtn">NEXT WINNER ▶</button>
        <button class="act-btn secondary" id="backBtn">← BACK TO EVENTS</button>
      </div>
    </div>

  </main>

  <!-- SPONSOR CAROUSEL -->
  <footer class="sponsor-zone" id="sponsorFooter">
    <div class="sponsor-label">OUR SPONSORS</div>
    <div class="carousel-viewport">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
  </footer>

  <script src="carousel.js"></script>
  <script src="tech-bg.js"></script>
  <script>
  (() => {
    'use strict';

    /* ─── Event data ───────────────────────────────────────────
       winners[] goes lowest → highest place revealed in order.
       So index 0 = revealed first (3rd for 3-prize events,
       2nd for CTF which only has 2 prizes).
    ──────────────────────────────────────────────────────────── */
    const EVENTS = {
      hackathon: {
        label: '⚡ HACKATHON',
        winners: [
          { place:'3RD PLACE', placeLabel:'THIRD PLACE',  medal:'🥉', cardC:'bronze-c', titleC:'bronze-t' },
          { place:'2ND PLACE', placeLabel:'SECOND PLACE', medal:'🥈', cardC:'silver-c', titleC:'silver-t' },
          { place:'1ST PLACE', placeLabel:'FIRST PLACE',  medal:'🥇', cardC:'gold-c',   titleC:'gold-t',   confetti:true },
        ],
      },
      ctf: {
        label: '🚩 CAPTURE THE FLAG',
        winners: [
          { place:'2ND PLACE', placeLabel:'SECOND PLACE', medal:'🥈', cardC:'silver-c', titleC:'silver-t' },
          { place:'1ST PLACE', placeLabel:'FIRST PLACE',  medal:'🥇', cardC:'gold-c',   titleC:'gold-t',   confetti:true },
        ],
      },
      gamedev: {
        label: '🎮 2D GAME DEV',
        winners: [
          { place:'3RD PLACE', placeLabel:'THIRD PLACE',  medal:'🥉', cardC:'bronze-c', titleC:'bronze-t' },
          { place:'2ND PLACE', placeLabel:'SECOND PLACE', medal:'🥈', cardC:'silver-c', titleC:'silver-t' },
          { place:'1ST PLACE', placeLabel:'FIRST PLACE',  medal:'🥇', cardC:'gold-c',   titleC:'gold-t',   confetti:true },
        ],
      },
    };

    /* ─── State ──────────────────────────────────────────────── */
    let curEvent  = null;
    let curWinIdx = 0;
    const done    = new Set();

    /* ─── DOM ────────────────────────────────────────────────── */
    const $ = id => document.getElementById(id);
    const scr      = { teaser:$('scr-teaser'), events:$('scr-events'), countdown:$('scr-countdown'), reveal:$('scr-reveal') };
    const cdNum    = $('cd-num');
    const cdEvLbl  = $('cd-event-lbl');
    const cdPrLbl  = $('cd-prize-lbl');
    const revBadge = $('rev-badge');
    const revPlace = $('rev-place');
    const revCard  = $('rev-card');
    const revMedal = $('rev-medal');
    const revTeam  = $('rev-team');
    const revCol   = $('rev-college');
    const progDots = $('prog-dots');
    const nextBtn  = $('nextBtn');
    const backBtn  = $('backBtn');
    const confWrap = $('confettiWrap');
    const sponsor  = $('sponsorFooter');

    /* ─── Screen switch ──────────────────────────────────────── */
    function show(name) {
      Object.entries(scr).forEach(([k, el]) => {
        if (k === name) {
          el.classList.remove('exit-up');
          el.classList.add('active');
        } else if (el.classList.contains('active')) {
          el.classList.add('exit-up');
          setTimeout(() => el.classList.remove('active','exit-up'), 500);
        }
      });
    }

    /* ─── Progress dots ──────────────────────────────────────── */
    function buildDots(total, idx) {
      progDots.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'prog-dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
        progDots.appendChild(d);
      }
    }

    /* ─── Countdown then reveal ──────────────────────────────── */
    function startCountdown(evKey, winIdx) {
      const ev  = EVENTS[evKey];
      const win = ev.winners[winIdx];
      curEvent  = evKey;
      curWinIdx = winIdx;

      cdEvLbl.textContent = ev.label;
      cdPrLbl.textContent = `REVEALING ${win.place}`;

      // reset cd-num
      cdNum.className   = 'cd-num';
      cdNum.textContent = '3';
      sponsor.style.display = 'none';
      show('countdown');

      let n = 3;

      const tick = () => {
        n--;
        if (n > 0) {
          cdNum.classList.add('fade');
          setTimeout(() => {
            cdNum.classList.remove('fade');
            cdNum.textContent = n;
            void cdNum.offsetWidth;
            cdNum.className = 'cd-num';
          }, 310);
          setTimeout(tick, 1000);
        } else {
          // show ✦ star
          cdNum.classList.add('fade');
          setTimeout(() => {
            cdNum.classList.remove('fade');
            cdNum.textContent = '✦';
            cdNum.className = 'cd-num star';
            void cdNum.offsetWidth;
            setTimeout(() => revealWinner(evKey, winIdx), 700);
          }, 310);
        }
      };
      setTimeout(tick, 1000);
    }

    /* ─── Reveal winner card ─────────────────────────────────── */
    function revealWinner(evKey, winIdx) {
      const ev   = EVENTS[evKey];
      const win  = ev.winners[winIdx];
      const last = winIdx === ev.winners.length - 1;

      revBadge.textContent = ev.label;
      revPlace.textContent = `${win.medal} ${win.placeLabel}`;
      revPlace.className   = `rev-place ${win.titleC}`;

      revCard.className    = `big-card ${win.cardC}`;

      // Re-trigger card animation
      revCard.style.animation  = 'none'; void revCard.offsetWidth;  revCard.style.animation  = '';
      revMedal.style.animation = 'none'; void revMedal.offsetWidth; revMedal.style.animation = '';

      revMedal.textContent    = win.medal;
      revTeam.textContent     = 'TEAM NAME';
      revCol.textContent      = 'College Name';

      buildDots(ev.winners.length, winIdx);

      if (last) {
        nextBtn.textContent = '← BACK TO EVENTS';
        nextBtn.onclick = goBack;
      } else {
        nextBtn.textContent = 'NEXT WINNER ▶';
        nextBtn.onclick = () => startCountdown(evKey, winIdx + 1);
      }

      show('reveal');
      if (win.confetti) launchConfetti();
    }

    /* ─── Back to event select ───────────────────────────────── */
    function goBack() {
      if (curEvent) {
        done.add(curEvent);
        const b = document.getElementById(`btn-${curEvent}`);
        if (b) b.classList.add('done');
        curEvent = null;
      }
      sponsor.style.display = '';
      show('events');
    }

    /* ─── Confetti ───────────────────────────────────────────── */
    function launchConfetti() {
      confWrap.innerHTML = '';
      const colors = ['#f5c518','#3d7fff','#4cff90','#ff4455','#fff','#c9b8ff','#ffb347'];
      for (let i = 0; i < 130; i++) {
        const p = document.createElement('div');
        const c = colors[Math.floor(Math.random() * colors.length)];
        p.className = 'cp';
        p.style.cssText = `
          left:${Math.random()*100}%;
          width:${5+Math.random()*9}px; height:${9+Math.random()*11}px;
          background:${c};
          border-radius:${Math.random()>.5?'50%':'2px'};
          animation-duration:${2.2+Math.random()*2.5}s;
          animation-delay:${Math.random()*.9}s;
          transform:rotate(${Math.random()*360}deg);
        `;
        confWrap.appendChild(p);
      }
      setTimeout(() => { confWrap.innerHTML = ''; }, 5000);
    }

    /* ─── Wire buttons ───────────────────────────────────────── */
    $('revealBtn').addEventListener('click', () => show('events'));

    document.querySelectorAll('.event-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.event;
        if (EVENTS[key]) startCountdown(key, 0);
      });
    });

    backBtn.addEventListener('click', goBack);

    /* ─── Editable field helpers ─────────────────────────────── */
    [revTeam, revCol].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key==='Enter'){e.preventDefault();el.blur();} });
      el.addEventListener('blur',    () => { if (!el.textContent.trim()) el.textContent = el.dataset.default; });
    });

  })();
  </script>
</body>
</html>
